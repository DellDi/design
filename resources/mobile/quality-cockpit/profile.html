<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>我的 - 移动驾驶舱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../../../dist/mobile-design.css">
    <link rel="stylesheet" href="./quality-cockpit.css">
  </head>
  <body>
    <main class="mobile-page w-full max-w-[430px] min-h-screen mx-auto bg-[#eef3fa] relative">
      <header class="mobile-navbar sticky top-0 z-20 bg-white/96 border-b border-[#e6ebf2] px-4">
        <a class="inline-flex items-center justify-center w-7 h-7 rounded-[var(--radius-mobile-control)] text-[var(--color-mobile-primary)] text-lg font-bold" href="./index.html">‹</a>
        <h1 class="mobile-title min-w-0 truncate text-left text-[17px] text-[var(--color-mobile-text-primary)]">我的</h1>
        <span class="inline-flex items-center gap-1 text-[var(--color-mobile-text-regular)] text-[13px]">2026年05月▼</span>
      </header>

      <div class="px-2.5 pb-[92px] pt-3">
        <section class="rounded-[18px] p-4 bg-[var(--color-mobile-card)] shadow-[var(--shadow-mobile-card)]">
          <div class="flex items-center gap-3">
            <div class="grid place-items-center w-14 h-14 rounded-full bg-[var(--color-mobile-primary-bg)] text-[var(--color-mobile-primary)] text-xl font-extrabold">杭</div>
            <div class="min-w-0">
              <div class="truncate text-[var(--color-mobile-text-primary)] text-lg font-bold leading-7">杭州新视窗演示账号</div>
              <div class="mt-0.5 text-[var(--color-mobile-text-secondary)] text-xs leading-[18px]">浙江绿荣智慧科技集团有限公司</div>
            </div>
          </div>
        </section>

        <section class="mt-3 rounded-[18px] p-4 bg-[var(--color-mobile-card)] shadow-[var(--shadow-mobile-card)]">
          <div class="text-[var(--color-mobile-text-primary)] text-[15px] font-bold leading-[22px]">常用模块</div>
          <div class="mt-3 grid grid-cols-2 gap-2.5">
            <a class="min-h-[92px] rounded-[14px] p-3 bg-[#f3f6fa] text-[var(--color-mobile-text-primary)] grid content-between shadow-[inset_0_0_0_1px_rgba(255,255,255,0.72)]" href="./index.html">
              <i class="grid place-items-center w-8 h-8 rounded-[10px] bg-[var(--color-mobile-primary)] text-white text-xs not-italic">品</i>
              <span>
                <strong class="block text-[14px] leading-5">品质总览</strong>
                <small class="block mt-0.5 text-[var(--color-mobile-text-secondary)] text-[11px] leading-4">巡检核心指标</small>
              </span>
            </a>
            <a class="min-h-[92px] rounded-[14px] p-3 bg-[#f3f6fa] text-[var(--color-mobile-text-primary)] grid content-between shadow-[inset_0_0_0_1px_rgba(255,255,255,0.72)]" href="./completion-detail.html">
              <i class="grid place-items-center w-8 h-8 rounded-[10px] bg-[var(--color-mobile-success)] text-white text-xs not-italic">完</i>
              <span>
                <strong class="block text-[14px] leading-5">巡检完成</strong>
                <small class="block mt-0.5 text-[var(--color-mobile-text-secondary)] text-[11px] leading-4">任务进度明细</small>
              </span>
            </a>
            <a class="min-h-[92px] rounded-[14px] p-3 bg-[#f3f6fa] text-[var(--color-mobile-text-primary)] grid content-between shadow-[inset_0_0_0_1px_rgba(255,255,255,0.72)]" href="./rectification-detail.html">
              <i class="grid place-items-center w-8 h-8 rounded-[10px] bg-[var(--color-mobile-warning)] text-white text-xs not-italic">改</i>
              <span>
                <strong class="block text-[14px] leading-5">整改闭环</strong>
                <small class="block mt-0.5 text-[var(--color-mobile-text-secondary)] text-[11px] leading-4">复核质量跟进</small>
              </span>
            </a>
            <div class="min-h-[92px] rounded-[14px] p-3 bg-[#f3f6fa] text-[var(--color-mobile-text-primary)] grid content-between shadow-[inset_0_0_0_1px_rgba(255,255,255,0.72)]">
              <i class="grid place-items-center w-8 h-8 rounded-[10px] bg-[var(--color-mobile-primary-bg)] text-[var(--color-mobile-primary)] text-xs font-bold not-italic">AI</i>
              <span>
                <strong class="block text-[14px] leading-5">AI小助手</strong>
                <small class="block mt-0.5 text-[var(--color-mobile-text-secondary)] text-[11px] leading-4">指标问答分析</small>
              </span>
            </div>
          </div>
        </section>

        <section class="mt-3 rounded-[18px] p-4 bg-[var(--color-mobile-card)] shadow-[var(--shadow-mobile-card)]">
          <div class="grid grid-cols-2 gap-2">
            <div class="rounded-[12px] p-3 bg-[#f3f6fa]">
              <div class="text-[var(--color-mobile-text-secondary)] text-xs leading-[18px]">当前角色</div>
              <div class="mt-1 text-[var(--color-mobile-text-primary)] text-[15px] font-bold">管理者</div>
            </div>
            <div class="rounded-[12px] p-3 bg-[#f3f6fa]">
              <div class="text-[var(--color-mobile-text-secondary)] text-xs leading-[18px]">数据权限</div>
              <div class="mt-1 text-[var(--color-mobile-text-primary)] text-[15px] font-bold">集团</div>
            </div>
          </div>
        </section>

        <a class="mt-4 flex items-center justify-center h-12 rounded-[14px] bg-white text-[var(--color-mobile-danger)] text-[15px] shadow-[var(--shadow-mobile-card)]" href="./index.html">退出登录</a>
      </div>

      <nav class="mobile-bottom-nav !grid-cols-4" aria-label="底部模块导航">
        <span class="grid content-center justify-items-center gap-1 text-[var(--color-mobile-text-secondary)] text-[11px] leading-3.5"><i class="block w-[18px] h-[18px] rounded-[5px] bg-current opacity-45"></i>财务</span>
        <span class="grid content-center justify-items-center gap-1 text-[var(--color-mobile-text-secondary)] text-[11px] leading-3.5"><i class="block w-[18px] h-[18px] rounded-[5px] bg-current opacity-45"></i>工单</span>
        <a class="grid content-center justify-items-center gap-1 text-[var(--color-mobile-text-secondary)] text-[11px] leading-3.5" href="./index.html"><i class="block w-[18px] h-[18px] rounded-[5px] bg-current opacity-45"></i>品质</a>
        <a class="grid content-center justify-items-center gap-1 text-[var(--color-mobile-primary)] text-[11px] leading-3.5" href="./profile.html"><i class="block w-[18px] h-[18px] rounded-full bg-current opacity-100"></i>我的</a>
      </nav>
    </main>
  </body>
</html>
