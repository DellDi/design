<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>巡检完成详情 - 品质驾驶舱</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../../../dist/mobile-design.css">
    <link rel="stylesheet" href="./quality-cockpit.css">
  </head>
  <body>
    <main class="mobile-page w-full max-w-[430px] min-h-screen mx-auto bg-[#eef3fa] relative">
      <header class="mobile-navbar sticky top-0 z-20 bg-white/96 border-b border-[#e6ebf2] px-4">
        <a class="inline-flex items-center justify-center w-7 h-7 rounded-[var(--radius-mobile-control)] text-[var(--color-mobile-primary)] text-lg font-bold" href="./index.html">‹</a>
        <h1 class="mobile-title min-w-0 truncate text-left text-[17px] text-[var(--color-mobile-text-primary)]">巡检完成情况</h1>
        <span class="inline-flex items-center gap-1 text-[var(--color-mobile-text-regular)] text-[13px]">2026年05月▼</span>
      </header>

      <div class="px-2.5 pb-[92px] pt-3">
        <section class="grid grid-cols-6 gap-2 mt-2.5">
          <article class="col-span-3 min-h-[74px] border border-[#e6ebf2] rounded-lg p-3 bg-[var(--color-mobile-card)]">
            <div class="text-[var(--color-mobile-text-secondary)] text-[13px] leading-[18px]">综合巡检任务数</div>
            <div class="mt-1.5 text-[var(--color-mobile-text-primary)] text-2xl font-extrabold leading-[30px]">1,248</div>
          </article>
          <article class="col-span-3 min-h-[74px] border border-[#e6ebf2] rounded-lg p-3 bg-[var(--color-mobile-card)]">
            <div class="text-[var(--color-mobile-text-secondary)] text-[13px] leading-[18px]">综合巡检完成数</div>
            <div class="mt-1.5 text-[var(--color-mobile-text-primary)] text-2xl font-extrabold leading-[30px]">1,073</div>
          </article>
          <article class="col-span-3 min-h-[74px] border border-[#e6ebf2] rounded-lg p-3 bg-[var(--color-mobile-card)]">
            <div class="text-[var(--color-mobile-text-secondary)] text-[13px] leading-[18px]">综合巡检完成率</div>
            <div class="mt-1.5 text-[var(--color-mobile-text-primary)] text-2xl font-extrabold leading-[30px]">86.0<small class="text-sm font-semibold">%</small></div>
            <div class="mt-1.75 text-[var(--color-mobile-text-secondary)] text-[10px] leading-[15px]">完成数 / 任务数　1,073 / 1,248</div>
          </article>
        </section>

        <section class="mt-3 rounded-[18px] p-4 bg-[var(--color-mobile-card)] shadow-[var(--shadow-mobile-card)]">
          <div class="flex items-center justify-between gap-3 mb-3">
            <h2 class="inline-flex items-center gap-1.5 text-[var(--color-mobile-text-primary)] text-[15px] font-bold leading-[22px]">
              <span class="w-[15px] h-[15px] rounded-[4px] bg-[var(--color-mobile-primary)] shadow-[inset_0_0_0_4px_rgba(255,255,255,0.32)]"></span>趋势
            </h2>
            <span class="text-[var(--color-mobile-text-secondary)] text-xs leading-[18px]">完成率</span>
          </div>
          <div class="grid grid-cols-3 my-2.5 mb-4.5 text-[var(--color-mobile-text-regular)] text-center text-[13px]">
            <span class="active text-[var(--color-mobile-primary)] relative pb-1 after:content-[''] after:block after:w-[22px] after:h-1 after:mx-auto after:mt-1.75 after:rounded-full after:bg-[#44b8ff]">完成率</span>
          </div>
          <div class="trend-chart">
            <div class="axis-y"><span>100</span><span>80</span><span>60</span><span>40</span><span>20</span></div>
            <svg viewBox="0 0 300 178" aria-label="综合巡检完成率趋势">
              <polyline points="0,42 28,61 56,49 84,44 112,39 140,36 168,32 196,35 224,30 252,28 280,25 300,24" fill="none" stroke="var(--color-mobile-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
              <g fill="var(--color-mobile-primary)" stroke="white" stroke-width="2">
                <circle cx="0" cy="42" r="4"/><circle cx="28" cy="61" r="4"/><circle cx="56" cy="49" r="4"/><circle cx="84" cy="44" r="4"/><circle cx="112" cy="39" r="4"/><circle cx="140" cy="36" r="4"/><circle cx="168" cy="32" r="4"/><circle cx="196" cy="35" r="4"/><circle cx="224" cy="30" r="4"/><circle cx="252" cy="28" r="4"/><circle cx="280" cy="25" r="4"/><circle cx="300" cy="24" r="4"/>
              </g>
            </svg>
            <div class="axis-x"><span>01月</span><span>04月</span><span>07月</span><span>10月</span><span>12月</span></div>
          </div>
        </section>

        <section class="mt-3 rounded-[18px] p-4 bg-[var(--color-mobile-card)] shadow-[var(--shadow-mobile-card)]">
          <div class="flex items-center justify-between gap-3 mb-3">
            <h2 class="inline-flex items-center gap-1.5 text-[var(--color-mobile-text-primary)] text-[15px] font-bold leading-[22px]">
              <span class="w-[15px] h-[15px] rounded-[4px] bg-[var(--color-mobile-primary)] shadow-[inset_0_0_0_4px_rgba(255,255,255,0.32)]"></span>排行榜
            </h2>
            <span class="text-[var(--color-mobile-text-secondary)] text-xs leading-[18px]">按完成率</span>
          </div>
          <div class="flex justify-between gap-2.5 mt-0.5 mb-3 text-[var(--color-mobile-text-regular)] text-xs leading-[18px]">
            <span>浙江绿荣智慧科技集团有限公司</span>
            <span>更多指标 ></span>
          </div>
          <div class="overflow-hidden rounded-[10px] bg-[var(--color-mobile-card)]">
            <div class="grid grid-cols-[1.25fr_1fr_1fr_1fr] min-h-[52px] items-center gap-2 px-2.5 text-[var(--color-mobile-text-primary)] bg-[#edf2f8] text-xs font-semibold max-[360px]:grid-cols-[1.15fr_0.85fr_0.9fr_0.85fr] max-[360px]:px-2">
              <span>组织</span>
              <span>任务数</span>
              <span>完成数</span>
              <span>完成率↓</span>
            </div>
            <div class="grid grid-cols-[1.25fr_1fr_1fr_1fr] min-h-[52px] items-center gap-2 px-2.5 text-[var(--color-mobile-text-regular)] bg-[#f6f8fb] text-xs max-[360px]:grid-cols-[1.15fr_0.85fr_0.9fr_0.85fr] max-[360px]:px-2">
              <span class="truncate"><i class="inline-grid place-items-center w-4 h-4 mr-1 rounded-full text-white bg-[var(--color-mobile-warning)] text-[10px] not-italic">1</i>滨江花园</span>
              <span>226</span>
              <span>217</span>
              <span>96%</span>
            </div>
            <div class="grid grid-cols-[1.25fr_1fr_1fr_1fr] min-h-[52px] items-center gap-2 px-2.5 text-[var(--color-mobile-text-regular)] bg-[#eef2f7] text-xs max-[360px]:grid-cols-[1.15fr_0.85fr_0.9fr_0.85fr] max-[360px]:px-2">
              <span class="truncate"><i class="inline-grid place-items-center w-4 h-4 mr-1 rounded-full text-white bg-[var(--color-mobile-warning)] text-[10px] not-italic">2</i>云栖公馆</span>
              <span>184</span>
              <span>169</span>
              <span>92%</span>
            </div>
            <div class="grid grid-cols-[1.25fr_1fr_1fr_1fr] min-h-[52px] items-center gap-2 px-2.5 text-[var(--color-mobile-text-regular)] bg-[#f6f8fb] text-xs max-[360px]:grid-cols-[1.15fr_0.85fr_0.9fr_0.85fr] max-[360px]:px-2">
              <span class="truncate"><i class="inline-grid place-items-center w-4 h-4 mr-1 rounded-full text-white bg-[var(--color-mobile-warning)] text-[10px] not-italic">3</i>湖畔中心</span>
              <span>198</span>
              <span>176</span>
              <span>89%</span>
            </div>
            <div class="grid grid-cols-[1.25fr_1fr_1fr_1fr] min-h-[52px] items-center gap-2 px-2.5 text-[var(--color-mobile-text-regular)] bg-[#eef2f7] text-xs max-[360px]:grid-cols-[1.15fr_0.85fr_0.9fr_0.85fr] max-[360px]:px-2">
              <span class="text-[var(--color-mobile-text-secondary)] truncate">4 星河国际</span>
              <span>160</span>
              <span>130</span>
              <span>81%</span>
            </div>
          </div>
        </section>

        <div class="py-2.5 pb-1.5 text-center text-[var(--color-mobile-text-secondary)] text-xs">- 我是有底线的 -</div>
      </div>
      <div class="float-top">⌃</div>
    </main>
  </body>
</html>
