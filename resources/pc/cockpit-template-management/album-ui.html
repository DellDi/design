<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>驾驶舱 BI 模板管理 - 专辑化设计稿</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="../../../dist/pc-design.css" />
  <style>
    :root {
      --primary: #1677ff;
      --primary-strong: #0f66e8;
      --primary-soft: #eaf3ff;
      --page: #f5f7fb;
      --panel: #ffffff;
      --line: #e6eaf0;
      --line-soft: #f0f3f7;
      --text: #263342;
      --text-mid: #617083;
      --text-weak: #9aa6b2;
      --success: #35b86b;
      --warning: #f4a62a;
      --danger: #ee5b5b;
      --nav: #17203a;
      --shadow: 0 8px 24px rgba(36, 55, 90, .08);
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 1280px;
      height: 100vh;
      overflow: hidden;
      color: var(--text);
      background: var(--page);
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      display: grid;
      grid-template-columns: 164px 1fr;
      grid-template-rows: 42px 1fr;
      height: 100vh;
    }

    .topbar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 18px;
      height: 42px;
      padding: 0 20px;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 1px 6px rgba(8, 41, 92, .22);
      z-index: 3;
    }

    .topbar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 142px;
      font-weight: 600;
    }

    .brand-mark {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.95) 0 42%, transparent 42% 58%, rgba(255,255,255,.95) 58%),
        linear-gradient(0deg, rgba(255,255,255,.35), rgba(255,255,255,.35));
    }

    .top-links {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 13px;
      opacity: .95;
    }

    .topbar .spacer {
      flex: 1;
    }

    .user {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #0d54b7;
      font-weight: 700;
    }

    .side {
      grid-row: 2;
      background: var(--nav);
      color: rgba(255, 255, 255, .72);
      padding: 12px 0;
    }

    .side-item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 40px;
      padding: 0 12px;
      font-size: 13px;
      border-left: 3px solid transparent;
    }

    .side-item.active {
      color: #fff;
      background: var(--primary);
      border-left-color: #9fd0ff;
    }

    .side-icon {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      background: currentColor;
      opacity: .82;
    }

    .main {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      grid-template-rows: 38px 1fr;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      align-items: end;
      gap: 6px;
      padding-left: 12px;
      background: #eef1f5;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      height: 32px;
      min-width: 104px;
      padding: 0 16px;
      line-height: 32px;
      color: var(--text-mid);
      background: #fff;
      border-radius: 7px 7px 0 0;
      font-size: 13px;
    }

    .tab.active {
      color: var(--primary);
      font-weight: 600;
    }

    .workspace {
      display: grid;
      grid-template-columns: 252px 1fr;
      min-height: 0;
      overflow: hidden;
    }

    .album-tree {
      min-width: 0;
      overflow: auto;
      background: #fff;
      border-right: 1px solid var(--line);
    }

    .tree-head {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 14px 12px;
      background: #fff;
      border-bottom: 1px solid var(--line-soft);
    }

    .tree-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .tree-title button,
    .ghost-btn,
    .icon-btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text-mid);
      border-radius: 6px;
      cursor: pointer;
    }

    .tree-title button {
      width: 28px;
      height: 28px;
      color: var(--primary);
      font-size: 18px;
      line-height: 1;
    }

    .tree-search {
      position: relative;
    }

    .tree-search input,
    .search input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 10px;
      color: var(--text);
      outline: none;
      background: #f9fafc;
    }

    .tree-section {
      padding: 10px 8px;
    }

    .quick-node,
    .tree-node,
    .tree-child {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 32px;
      padding: 0 8px;
      border-radius: 6px;
      color: var(--text-mid);
      cursor: pointer;
    }

    .quick-node:hover,
    .tree-node:hover,
    .tree-child:hover {
      background: #f5f8fc;
    }

    .tree-node.active,
    .tree-child.active {
      color: var(--primary);
      background: var(--primary-soft);
      font-weight: 600;
    }

    .node-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .caret {
      width: 16px;
      color: var(--text-weak);
      text-align: center;
    }

    .folder-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .count {
      min-width: 22px;
      height: 18px;
      padding: 0 6px;
      border-radius: 9px;
      line-height: 18px;
      text-align: center;
      color: var(--text-weak);
      background: #f1f3f6;
      font-size: 12px;
    }

    .tree-child {
      margin-left: 28px;
      font-size: 13px;
    }

    .content {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 14px 16px 12px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .type-switch {
      display: flex;
      height: 36px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(20, 39, 68, .04);
    }

    .type-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 28px;
      padding: 0 13px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--text-mid);
      cursor: pointer;
    }

    .type-btn.active {
      color: #fff;
      background: var(--primary);
      box-shadow: 0 4px 12px rgba(22, 119, 255, .22);
    }

    .mini-icon {
      width: 14px;
      height: 14px;
      border: 2px solid currentColor;
      border-radius: 3px;
    }

    .mini-icon.phone {
      width: 10px;
      height: 16px;
      border-radius: 4px;
    }

    .mini-icon.screen {
      border-radius: 2px;
      transform: scaleX(1.25);
    }

    .filters {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-width: 0;
    }

    .toolbar-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .search {
      width: 260px;
    }

    .select {
      height: 32px;
      padding: 0 28px 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text-mid);
      background: #fff;
    }

    .primary-btn,
    .ghost-btn {
      height: 32px;
      padding: 0 12px;
    }

    .primary-btn {
      border: 1px solid var(--primary);
      border-radius: 6px;
      color: #fff;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(22, 119, 255, .18);
    }

    .context {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
      color: var(--text-weak);
      font-size: 12px;
    }

    .breadcrumb button {
      height: 24px;
      padding: 0 7px;
      font-size: 12px;
    }

    .type-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .context-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .album-thumb {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      width: 86px;
      height: 58px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
    }

    .shot {
      border-radius: 3px;
      background:
        linear-gradient(90deg, rgba(22,119,255,.14) 0 34%, transparent 34%),
        linear-gradient(180deg, rgba(22,119,255,.18), rgba(53,184,107,.12));
      position: relative;
      overflow: hidden;
    }

    .shot::before,
    .shot::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      height: 2px;
      border-radius: 2px;
      background: rgba(38, 51, 66, .16);
    }

    .shot::before {
      top: 28%;
    }

    .shot::after {
      top: 56%;
      width: 58%;
    }

    .context-text {
      min-width: 0;
      flex: 1;
    }

    .context-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .context-title h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .tag,
    .chip {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 11px;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .hidden {
      display: none !important;
    }

    .drill-guide {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      color: var(--text-mid);
      font-size: 12px;
    }

    .drill-step {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .drill-step.active {
      color: var(--primary);
      border-color: #b9d8ff;
      background: var(--primary-soft);
      font-weight: 600;
    }

    .drill-arrow {
      color: var(--text-weak);
    }

    .meta {
      color: var(--text-mid);
      font-size: 13px;
    }

    .context-actions {
      display: flex;
      gap: 8px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 18px 0 10px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .section-head span {
      color: var(--text-weak);
      font-size: 12px;
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-content: start;
      gap: 12px;
    }

    .album-card,
    .template-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      box-shadow: var(--shadow);
    }

    .album-card {
      cursor: pointer;
      overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .album-card:hover {
      transform: translateY(-2px);
      border-color: #c7ddff;
      box-shadow: 0 14px 30px rgba(35, 82, 148, .13);
    }

    .album-card.active {
      border-color: var(--primary);
      box-shadow: 0 14px 30px rgba(22, 119, 255, .16);
    }

    .album-cover {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 4px;
      height: 126px;
      padding: 10px;
      background: #f6f9fd;
      border-bottom: 1px solid var(--line-soft);
    }

    .album-cover .cover-main,
    .album-cover .cover-side {
      border-radius: 6px;
      background: #fff;
      border: 1px solid #e8eef6;
      overflow: hidden;
      position: relative;
    }

    .cover-main::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 6px;
      background:
        linear-gradient(90deg, rgba(22,119,255,.18) 0 26%, transparent 26%),
        linear-gradient(180deg, rgba(91,141,249,.18), rgba(97,221,170,.16));
    }

    .cover-main::after {
      content: "";
      position: absolute;
      width: 34px;
      height: 34px;
      right: 16px;
      bottom: 16px;
      border: 8px solid rgba(22,119,255,.28);
      border-top-color: rgba(53,184,107,.68);
      border-radius: 50%;
    }

    .cover-side {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      border: 0 !important;
      background: transparent !important;
    }

    .cover-side div {
      border: 1px solid #e8eef6;
      border-radius: 6px;
      background:
        repeating-linear-gradient(90deg, rgba(38,51,66,.08) 0 12px, transparent 12px 20px),
        linear-gradient(180deg, #fff, #eef6ff);
    }

    .album-info {
      padding: 11px 12px 12px;
    }

    .album-name {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .album-desc {
      min-height: 18px;
      overflow: hidden;
      color: var(--text-mid);
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12px;
    }

    .album-foot {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: var(--text-weak);
      font-size: 12px;
    }

    .album-action {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
    }

    .album-action span:last-child {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      line-height: 22px;
      text-align: center;
      background: var(--primary-soft);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      height: 28px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .chip.active {
      color: #fff;
      background: var(--primary);
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      align-content: start;
      gap: 12px;
    }

    .list-panel {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding-bottom: 8px;
    }

    .list-panel.hidden {
      display: none;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 42px;
      padding: 0 2px;
      color: var(--text-mid);
      font-size: 13px;
      border-top: 1px solid var(--line-soft);
      background: var(--page);
    }

    .pager-left,
    .pager-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pager select {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text-mid);
      background: #fff;
    }

    .page-btn {
      min-width: 30px;
      height: 30px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--text-mid);
      background: #fff;
      cursor: pointer;
    }

    .page-btn.active {
      color: #fff;
      border-color: var(--primary);
      background: var(--primary);
    }

    .page-btn:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .template-card {
      position: relative;
      overflow: hidden;
    }

    .template-create-card {
      display: grid;
      place-items: center;
      min-height: 240px;
      border: 1px dashed #b8d6ff;
      border-radius: var(--radius);
      background: #f8fbff;
      color: var(--primary);
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }

    .template-create-card:hover {
      border-color: var(--primary);
      background: #f1f7ff;
      box-shadow: 0 10px 24px rgba(22, 119, 255, .12);
    }

    .create-inner {
      display: grid;
      justify-items: center;
      gap: 10px;
      text-align: center;
    }

    .create-plus {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: var(--primary);
      color: #fff;
      font-size: 34px;
      line-height: 1;
      box-shadow: 0 10px 24px rgba(22, 119, 255, .22);
    }

    .create-title {
      color: var(--text);
      font-weight: 600;
    }

    .create-desc {
      color: var(--text-weak);
      font-size: 12px;
    }

    .template-preview {
      position: relative;
      height: 138px;
      padding: 12px;
      background: #f7f9fc;
      border-bottom: 1px solid var(--line-soft);
    }

    .dashboard {
      width: 100%;
      height: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
      position: relative;
    }

    .dashboard::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 20px;
      background: linear-gradient(90deg, rgba(22,119,255,.16), rgba(22,119,255,.03));
      border-bottom: 1px solid #edf1f6;
    }

    .chart-line {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 18px;
      height: 44px;
      border-bottom: 1px solid #dce4ee;
      border-left: 1px solid #dce4ee;
    }

    .chart-line::before {
      content: "";
      position: absolute;
      inset: 8px 8px 10px 6px;
      background: linear-gradient(135deg, transparent 0 20%, #5b8ff9 20% 24%, transparent 24% 42%, #35b86b 42% 46%, transparent 46% 70%, #f4a62a 70% 74%, transparent 74%);
    }

    .chart-bars {
      position: absolute;
      left: 14px;
      top: 34px;
      display: flex;
      align-items: end;
      gap: 5px;
      width: 42%;
      height: 40px;
    }

    .chart-bars i {
      display: block;
      flex: 1;
      border-radius: 2px 2px 0 0;
      background: #5b8ff9;
      opacity: .78;
    }

    .chart-bars i:nth-child(2) { height: 65%; background: #61ddaa; }
    .chart-bars i:nth-child(3) { height: 45%; background: #f6bd16; }
    .chart-bars i:nth-child(4) { height: 84%; }

    .chart-donut {
      position: absolute;
      right: 18px;
      top: 38px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: conic-gradient(#1677ff 0 44%, #61ddaa 44% 70%, #f6bd16 70% 86%, #e7edf5 86%);
    }

    .chart-donut::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      background: #fff;
    }

    .mobile-preview {
      display: grid;
      place-items: center;
    }

    .phone-frame {
      width: 66px;
      height: 112px;
      border: 4px solid #263342;
      border-radius: 13px;
      background:
        linear-gradient(180deg, rgba(22,119,255,.18) 0 28%, transparent 28%),
        repeating-linear-gradient(180deg, #fff 0 16px, #f0f5fb 16px 17px);
      box-shadow: 20px 0 0 -6px rgba(22,119,255,.12), -20px 0 0 -6px rgba(53,184,107,.12);
    }

    .screen-preview .dashboard {
      background: #0b1730;
      border-color: #1e3e6f;
    }

    .screen-preview .dashboard::before {
      background: linear-gradient(90deg, rgba(79,227,255,.24), rgba(47,123,255,.04));
      border-color: rgba(79,227,255,.18);
    }

    .screen-preview .chart-line,
    .screen-preview .chart-bars,
    .screen-preview .chart-donut {
      filter: saturate(1.15) brightness(1.1);
    }

    .recommend {
      position: absolute;
      left: 10px;
      top: 10px;
      height: 22px;
      padding: 0 8px;
      border-radius: 11px;
      color: #fff;
      background: var(--primary);
      font-size: 12px;
      line-height: 22px;
      box-shadow: 0 4px 10px rgba(22,119,255,.22);
    }

    .card-body {
      padding: 11px 12px 12px;
    }

    .template-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;

    .inspector {
      min-width: 0;

      background: #fff;
      border-left: 1px solid var(--line);
      padding: 14px;
    }

    .inspect-card {

    .stat-grid {
      display: grid;

    .modal-mask {

      display: grid;
      place-items: center;
      background: rgba(18, 31, 55, .38);
      backdrop-filter: blur(2px);
    }

    .modal {
      width: 640px;
      border-radius: 10px;

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 52px;
      padding: 0 18px;

    .modal-close {
      width: 30px;
      height: 30px;
      border: 0;

    .modal-close:hover {
      background: #f4f6f9;

    .album-form {
      padding: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-item {
      display: grid;
      gap: 7px;
    }

    .form-item.full {
      grid-column: 1 / -1;
    }

    .form-item label {
      color: var(--text-mid);
      font-size: 13px;
    }

    .form-item input,
    .form-item select,
    .form-item textarea {
      width: 100%;
      border: 1px solid var(--line);

    @media (max-width: 1440px) {

    }
  </style>
</head>

  <script>
    const categoryTree = [
      {
        id: "south",
        name: "华南区域",
        children: [
          { id: "south-core", name: "核心经营" },
          { id: "south-service", name: "服务品质" }

      {

      {

        children: [
          { id: "west-quality", name: "品质巡检" },
          { id: "west-store", name: "仓储采购" }
        ]
      }
    ];

    const albums = [
      { id: "a-south-overview", categoryId: "south-core", name: "华南经营总览专辑", desc: "区域经营、项目收入、收缴趋势等模板集合。", tags: ["经营", "总览", "区域"], coverTag: "经营", isBuiltin: true, updatedAt: "2026-05-08" },
      { id: "a-south-finance", categoryId: "south-core", name: "华南收费分析专辑", desc: "收费、欠费、回款、预算执行相关模板。", tags: ["财务", "收费", "趋势"], coverTag: "财务", isBuiltin: true, updatedAt: "2026-05-01" },
      { id: "a-south-service", categoryId: "south-service", name: "华南客户服务专辑", desc: "满意度、投诉、服务响应相关模板。", tags: ["工单", "服务", "排名"], coverTag: "工单", isBuiltin: false, updatedAt: "2026-04-28" },
      { id: "a-east-finance", categoryId: "east-finance", name: "华东财务经营专辑", desc: "收入、成本、预算、利润指标模板。", tags: ["财务", "明细", "预警"], coverTag: "财务", isBuiltin: true, updatedAt: "2026-05-06" },
      { id: "a-east-device", categoryId: "east-device", name: "华东设备运维专辑", desc: "设备台账、巡检、告警、维保模板集合。", tags: ["设备", "预警", "趋势"], coverTag: "设备", isBuiltin: false, updatedAt: "2026-04-25" },
      { id: "a-central-workorder", categoryId: "central-workorder", name: "华中工单服务专辑", desc: "工单响应、完成率、超时预警模板集合。", tags: ["工单", "服务", "预警"], coverTag: "工单", isBuiltin: false, updatedAt: "2026-05-07" },
      { id: "a-west-quality", categoryId: "west-quality", name: "华西品质巡检专辑", desc: "品质检查、整改闭环、区域排名模板集合。", tags: ["品质", "排名", "明细"], coverTag: "品质", isBuiltin: false, updatedAt: "2026-05-03" }
    ];

    const templates = [
      { id: "t-1", albumId: "a-south-overview", name: "区域经营驾驶舱", type: "screen", tags: ["经营", "总览", "推荐"], isBuiltin: true, isReferenced: true, isRecommended: true, isFavorite: false, updatedAt: "2026-05-02" },
      { id: "t-2", albumId: "a-south-overview", name: "项目经营总览", type: "pc", tags: ["经营", "总览"], isBuiltin: true, isReferenced: true, isRecommended: false, isFavorite: true, updatedAt: "2026-05-05" },
      { id: "t-3", albumId: "a-south-overview", name: "移动经营简报", type: "mobile", tags: ["经营", "最新"], isBuiltin: false, isReferenced: false, isRecommended: false, isFavorite: false, updatedAt: "2026-05-08" },
      { id: "t-4", albumId: "a-south-finance", name: "收费回款分析", type: "pc", tags: ["财务", "趋势", "推荐"], isBuiltin: true, isReferenced: true, isRecommended: true, isFavorite: false, updatedAt: "2026-04-29" },
      { id: "t-5", albumId: "a-south-finance", name: "欠费预警看板", type: "screen", tags: ["财务", "预警"], isBuiltin: false, isReferenced: false, isRecommended: false, isFavorite: false, updatedAt: "2026-05-01" },
      { id: "t-6", albumId: "a-east-device", name: "设备告警分析", type: "screen", tags: ["设备", "预警"], isBuiltin: false, isReferenced: true, isRecommended: false, isFavorite: false, updatedAt: "2026-04-25" },
      { id: "t-7", albumId: "a-central-workorder", name: "工单响应趋势", type: "pc", tags: ["工单", "趋势"], isBuiltin: false, isReferenced: false, isRecommended: false, isFavorite: true, updatedAt: "2026-05-07" },
      { id: "t-8", albumId: "a-west-quality", name: "品质整改排名", type: "pc", tags: ["品质", "排名"], isBuiltin: false, isReferenced: false, isRecommended: false, isFavorite: false, updatedAt: "2026-05-03" }
    ];

    const tagCatalog = [
      { id: "all", name: "全部", source: "system" },
      { id: "finance", name: "财务", source: "builtin" },
      { id: "workorder", name: "工单", source: "builtin" },
      { id: "quality", name: "品质", source: "builtin" },
      { id: "overview", name: "总览", source: "custom" },
      { id: "trend", name: "趋势", source: "custom" },
      { id: "rank", name: "排名", source: "custom" },
      { id: "warning", name: "预警", source: "custom" },
      { id: "recommend", name: "推荐", source: "system" },
      { id: "latest", name: "最新", source: "system" },
      { id: "favorite", name: "收藏", source: "system" }
    ];
    const chips = tagCatalog.map(tag => tag.name);
    let currentType = "pc";
    let currentCategory = categoryTree[0].children[0];
    let currentAlbum = null;
    let viewMode = "albums";
    let activeChip = "全部";
    let albumPage = 1;
    let templatePage = 1;
    const pageSize = 8;

    function typeName(type) {
      return { mobile: "移动端模板", pc: "PC 模板", screen: "数据大屏模板" }[type];
    }

    function typeSwitchMarkup() {
      return `
        <div class="type-switch" id="typeSwitch">
          <button class="type-btn ${currentType === "mobile" ? "active" : ""}" data-type="mobile"><span class="mini-icon phone"></span>移动端</button>
          <button class="type-btn ${currentType === "pc" ? "active" : ""}" data-type="pc"><span class="mini-icon"></span>PC</button>
          <button class="type-btn ${currentType === "screen" ? "active" : ""}" data-type="screen"><span class="mini-icon screen"></span>数据大屏</button>
        </div>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function flatCategories() {
      return categoryTree.flatMap(group => [
        { id: group.id, name: group.name, parentId: null, isGroup: true },
        ...group.children.map(child => ({ ...child, parentId: group.id, parentName: group.name }))
      ]);
    }

    function categoryById(id) {
      return flatCategories().find(item => item.id === id);
    }

    function childCategoryIds(category) {
      if (!category) return flatCategories().filter(item => !item.isGroup).map(item => item.id);
      if (!category.isGroup) return [category.id];
      const group = categoryTree.find(item => item.id === category.id);
      return group ? group.children.map(item => item.id) : [category.id];
    }

    function albumsForCategory(category = currentCategory) {
      const ids = childCategoryIds(category);
      return albums.filter(album => ids.includes(album.categoryId));
    }

    function templatesForAlbum(album = currentAlbum) {
      if (!album) return [];
      return templates.filter(template => template.albumId === album.id && template.type === currentType);
    }

    function allTemplatesForAlbums(albumList) {
      const ids = albumList.map(album => album.id);
      return templates.filter(template => ids.includes(template.albumId));
    }

    function clampPage(page, total) {
      const maxPage = Math.max(1, Math.ceil(total / pageSize));
      return Math.min(Math.max(1, page), maxPage);
    }

    function pageItems(items, page) {
      const start = (page - 1) * pageSize;
      return items.slice(start, start + pageSize);
    }

    function renderPager(id, total, currentPage, pageKind) {
      const pager = document.getElementById(id);
      const maxPage = Math.max(1, Math.ceil(total / pageSize));
      pager.classList.remove("hidden");
      pager.innerHTML = `
        <div class="pager-left">
          <span>共 ${total} 条</span>
          <select disabled><option>${pageSize} 条/页</option></select>
        </div>
        <div class="pager-right">
          <button class="page-btn" data-page-kind="${pageKind}" data-page="${currentPage - 1}" ${currentPage <= 1 ? "disabled" : ""}>上一页</button>
          ${Array.from({ length: maxPage }, (_, index) => `
            <button class="page-btn ${index + 1 === currentPage ? "active" : ""}" data-page-kind="${pageKind}" data-page="${index + 1}">${index + 1}</button>
          `).join("")}
          <button class="page-btn" data-page-kind="${pageKind}" data-page="${currentPage + 1}" ${currentPage >= maxPage ? "disabled" : ""}>下一页</button>
        </div>
      `;
    }

    function hidePager(id) {
      document.getElementById(id).classList.add("hidden");
    }

    function renderTree() {
      const tree = document.getElementById("tree");
      document.getElementById("allCount").textContent = albums.length;
      tree.innerHTML = categoryTree.map(group => {
        const groupCategory = categoryById(group.id);
        const groupAlbums = albumsForCategory(groupCategory);
        return `
          <div class="tree-node ${currentCategory && group.id === currentCategory.id ? "active" : ""}" data-category="${group.id}">
            <span class="node-left"><span class="caret">▾</span><span class="folder-dot"></span>${group.name}</span>
            <span class="count">${groupAlbums.length}</span>
          </div>
          ${group.children.map(child => {
            const albumCount = albumsForCategory(child).length;
            return `
              <div class="tree-child ${currentCategory && child.id === currentCategory.id ? "active" : ""}" data-category="${child.id}">
                <span>${child.name}</span><span class="count">${albumCount}</span>
              </div>
            `;
          }).join("")}
        `;
      }).join("");
      tree.querySelectorAll("[data-category]").forEach(node => {
        node.addEventListener("click", () => {
          currentCategory = categoryById(node.dataset.category);
          currentAlbum = null;
          viewMode = "albums";
          albumPage = 1;
          render();
        });
      });
      document.querySelectorAll(".quick-node").forEach(node => {
        node.addEventListener("click", () => {
          if (node.dataset.quick === "all") {
            currentCategory = null;
            currentAlbum = null;
            viewMode = "albums";
            albumPage = 1;
            render();
          }
        });
      });
    }

    function renderContext() {
      if (viewMode === "albums" || !currentAlbum) {
        const albumList = albumsForCategory();
        const templateTotal = allTemplatesForAlbums(albumList).filter(template => template.type === currentType).length;
        const title = currentCategory ? currentCategory.name : "全部分类";
        document.getElementById("context").innerHTML = `
          <div class="breadcrumb">模板管理 / 分类树 / <button class="ghost-btn" data-nav="albums">${title}</button></div>
          <div class="type-row">
            ${typeSwitchMarkup()}
          </div>
        `;
        return;
      }
      const category = categoryById(currentAlbum.categoryId);
      const templateCount = templatesForAlbum().length;
      document.getElementById("context").innerHTML = `
        <div class="breadcrumb">
          模板管理 / 分类树 /
          <button class="ghost-btn" data-nav="category">${category ? category.name : "未分类"}</button> /
          <button class="ghost-btn" data-nav="albums">${currentAlbum.name}</button> /
          模板列表
        </div>
        <div class="type-row">
          ${typeSwitchMarkup()}
        </div>
      `;
      document.querySelectorAll("[data-nav]").forEach(node => {
        node.addEventListener("click", () => {
          currentAlbum = null;
          viewMode = "albums";
          render();
        });
      });
    }

    function renderAlbums() {
      const head = document.getElementById("albumSectionHead");
      const grid = document.getElementById("albumGrid");
      const panel = document.getElementById("albumListPanel");
      head.classList.toggle("hidden", viewMode !== "albums");
      panel.classList.toggle("hidden", viewMode !== "albums");
      if (viewMode !== "albums") {
        grid.innerHTML = "";
        hidePager("albumPager");
        return;
      }
      const albumList = albumsForCategory();
      document.querySelector("#albumSectionHead h2").textContent = `${currentCategory ? currentCategory.name : "全部分类"} · 专辑入口`;
      if (!albumList.length) {
        grid.innerHTML = `<div class="empty-state"><div><strong>当前分类暂无专辑</strong><span>可通过右上角加号新增专辑，或由后台脚本初始化。</span></div></div>`;
        renderPager("albumPager", 0, 1, "album");
        return;
      }
      albumPage = clampPage(albumPage, albumList.length);
      const pageAlbumList = pageItems(albumList, albumPage);
      grid.innerHTML = pageAlbumList.map(album => {
        const albumTemplates = templates.filter(template => template.albumId === album.id);
        const typedCount = albumTemplates.filter(template => template.type === currentType).length;
        return `
          <article class="album-card" data-album="${album.id}">
            <div class="album-cover">
              <div class="cover-main"></div>
              <div class="cover-side"><div></div><div></div></div>
            </div>
            <div class="album-info">
              <div class="album-name">
                <span>${album.name}</span>
                ${album.isBuiltin ? '<span class="tag">内置</span>' : `<span class="tag">${typedCount}</span>`}
              </div>
              <div class="album-desc">${album.desc}</div>
              <div class="template-tags">${album.tags.map(tag => `<span>${tag}</span>`).join("")}</div>
              <div class="album-foot"><span>${typeName(currentType)} ${typedCount} 个</span><span>更新 ${album.updatedAt}</span></div>
              <div class="album-action"><span>进入模板列表</span><span>›</span></div>
            </div>
          </article>
        `;
      }).join("");
      document.querySelectorAll(".album-card").forEach(card => {
        card.addEventListener("click", () => {
          currentAlbum = albums.find(item => item.id === card.dataset.album);
          viewMode = "templates";
          templatePage = 1;
          render();
        });
      });
      renderPager("albumPager", albumList.length, albumPage, "album");
    }

    function renderChips() {
      document.getElementById("chips").innerHTML = chips.map(chip => `
        <span class="chip ${chip === activeChip ? "active" : ""}" data-chip="${chip}">${chip}</span>
      `).join("");
      document.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", () => {
          activeChip = chip.dataset.chip;
          templatePage = 1;
          render();
        });
      });
    }

    function templateMatchesChip(template) {
      if (activeChip === "全部") return true;
      if (activeChip === "推荐") return template.isRecommended;
      if (activeChip === "收藏") return template.isFavorite;
      if (activeChip === "最新") return template.tags.includes("最新");
      return template.tags.includes(activeChip);
    }

    function renderTemplates() {
      const head = document.getElementById("templateSectionHead");
      const chipsEl = document.getElementById("chips");
      const grid = document.getElementById("templateGrid");
      const panel = document.getElementById("templateListPanel");
      head.classList.toggle("hidden", viewMode !== "templates" || !currentAlbum);
      chipsEl.classList.toggle("hidden", viewMode !== "templates" || !currentAlbum);
      panel.classList.toggle("hidden", viewMode !== "templates" || !currentAlbum);
      if (viewMode !== "templates" || !currentAlbum) {
        grid.innerHTML = "";
        hidePager("templatePager");
        return;
      }
      const typedClass = currentType === "mobile" ? "mobile-preview" : currentType === "screen" ? "screen-preview" : "";
      const templateList = templatesForAlbum().filter(templateMatchesChip);
      document.getElementById("templateTitle").textContent = `${currentAlbum.name} · 模板列表`;
      document.getElementById("resultText").textContent = `当前筛选 ${templateList.length} 个模板`;
      const createCard = `
        <article class="template-create-card">
          <div class="create-inner">
            <span class="create-plus">+</span>
            <span class="create-title">新建模板</span>
            <span class="create-desc">在当前专辑下创建模板</span>
          </div>
        </article>
      `;
      if (!templateList.length) {
        grid.innerHTML = `
          ${createCard}
          <div class="empty-state">
            <div>
              <strong>当前筛选下暂无模板</strong>
              <span>可切换终端类型或清空标签筛选。</span>
            </div>
          </div>
        `;
        renderPager("templatePager", 0, 1, "template");
        return;
      }
      templatePage = clampPage(templatePage, templateList.length);
      const pageTemplateList = pageItems(templateList, templatePage);
      const templateCards = pageTemplateList.map((template, index) => {
        const cannotDelete = template.isBuiltin || template.isReferenced;
        return `
          <article class="template-card">
            <div class="template-preview ${typedClass}">
              ${template.isRecommended ? '<span class="recommend">推荐</span>' : ""}
              ${currentType === "mobile"
                ? '<div class="phone-frame"></div>'
                : `<div class="dashboard">
                    <div class="chart-bars"><i style="height:${50 + index * 6}%"></i><i></i><i></i><i></i></div>
                    <div class="chart-donut"></div>
                    <div class="chart-line"></div>
                  </div>`}
            </div>
            <div class="card-actions">
              <button>预览</button><button>复制</button><button>编辑</button><button ${cannotDelete ? "disabled" : ""}>删除</button>
            </div>
            <div class="card-body">
              <div class="template-title">
                <span>${template.name}</span>
                ${template.isReferenced ? '<span class="status draft">已被引用</span>' : '<span class="status">未被引用</span>'}
              </div>
              <div class="template-tags">
                ${template.tags.map(tag => `<span>${tag}</span>`).join("")}
                <span>${typeName(template.type).replace("模板", "")}</span>
                ${template.isBuiltin ? "<span>内置</span>" : ""}
              </div>
              <div class="template-meta"><span>快照由预览生成</span><span>${template.updatedAt}</span></div>
            </div>
          </article>
        `;
      }).join("");
      grid.innerHTML = `${createCard}${templateCards}`;
      renderPager("templatePager", templateList.length, templatePage, "template");
    }

    function renderInspector() {
      const albumList = currentAlbum ? [currentAlbum] : albumsForCategory();
      const templateList = currentAlbum ? templates.filter(template => template.albumId === currentAlbum.id) : allTemplatesForAlbums(albumList);
      document.getElementById("inspectMode").textContent = currentAlbum ? "模板视图" : "分类视图";
      document.getElementById("statTemplates").textContent = templateList.length;
      document.getElementById("statCategories").textContent = albumList.length;
      document.getElementById("statUses").textContent = templateList.filter(template => template.isReferenced).length;
      document.getElementById("statDrafts").textContent = templateList.filter(template => template.isBuiltin).length;
    }

    function renderCategoryOptions() {
      document.getElementById("albumCategory").innerHTML = flatCategories()
        .filter(category => !category.isGroup)
        .map(category => `<option value="${category.id}">${category.parentName} / ${category.name}</option>`)
        .join("");
    }

    function bindTypeSwitch() {
      document.querySelectorAll(".type-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentType = btn.dataset.type;
          activeChip = "全部";
          albumPage = 1;
          templatePage = 1;
          render();
        });
      });
    }

    function render() {
      renderTree();
      renderContext();
      renderAlbums();
      renderChips();
      renderTemplates();
      renderCategoryOptions();
      bindTypeSwitch();
    }

    function openAlbumModal() {
      const form = document.getElementById("albumForm");
      form.reset();
      document.getElementById("albumCategory").value = currentCategory && !currentCategory.isGroup ? currentCategory.id : flatCategories().find(item => !item.isGroup).id;
      document.getElementById("albumTags").value = "经营、总览";
      document.getElementById("coverUploadItem").classList.add("hidden");
      document.getElementById("albumModal").classList.remove("hidden");
      setTimeout(() => document.getElementById("albumName").focus(), 0);
    }

    function closeAlbumModal() {
      document.getElementById("albumModal").classList.add("hidden");
    }

    function createAlbumFromForm(event) {
      event.preventDefault();
      const data = new FormData(event.currentTarget);
      const tags = data.get("albumTags")
        .split(/[、,，]/)
        .map(item => item.trim())
        .filter(Boolean);
      const album = {
        id: `custom-${Date.now()}`,
        categoryId: data.get("albumCategory"),
        name: escapeHtml(data.get("albumName").trim()),
        desc: escapeHtml(data.get("albumDesc").trim() || "新建专辑，模板将通过二级下钻进入管理。"),
        tags: tags.length ? tags.map(escapeHtml) : ["自定义"],
        coverTag: tags[0] || "经营",
        isBuiltin: data.get("isBuiltinAlbum") === "on",
        updatedAt: new Date().toISOString().slice(0, 10)
      };
      albums.unshift(album);
      currentCategory = categoryById(album.categoryId);
      currentAlbum = null;
      viewMode = "albums";
      albumPage = 1;
      closeAlbumModal();
      render();
    }

    document.addEventListener("click", event => {
      if (event.target.closest(".open-album-modal")) {
        openAlbumModal();
        return;
      }
      const pageButton = event.target.closest("[data-page-kind]");
      if (pageButton && !pageButton.disabled) {
        const nextPage = Number(pageButton.dataset.page);
        if (pageButton.dataset.pageKind === "album") {
          albumPage = nextPage;
        } else {
          templatePage = nextPage;
        }
        render();
      }
    });

    document.getElementById("closeAlbumModal").addEventListener("click", closeAlbumModal);
    document.getElementById("cancelAlbumModal").addEventListener("click", closeAlbumModal);
    document.getElementById("albumModal").addEventListener("click", event => {
      if (event.target.id === "albumModal") {
        closeAlbumModal();
      }
    });
    document.getElementById("albumForm").addEventListener("submit", createAlbumFromForm);
    document.getElementById("albumCover").addEventListener("change", event => {
      document.getElementById("coverUploadItem").classList.toggle("hidden", event.target.value !== "upload");
    });

    render();
  </script>
</body>
</html>
