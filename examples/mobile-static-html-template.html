<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>移动端静态设计稿模板</title>
    <link rel="stylesheet" href="../dist/mobile-design.css">
  </head>
  <body>
    <main class="mobile-page">
      <header class="mobile-navbar">
        <h1 class="mobile-title">移动工作台</h1>
      </header>

      <div class="mobile-content">
        <section class="mobile-banner">
          <div class="mobile-title">业务首页</div>
          <div class="mobile-subtitle">用于移动端业务首页、工单、工作台和移动驾驶舱的静态 HTML 设计稿。</div>
        </section>

        <section class="mobile-section">
          <h2 class="mobile-section-title">待办工单</h2>
          <div class="mobile-list">
            <article class="mobile-list-card">
              <div class="mobile-list-title">工单标题</div>
              <div class="mobile-list-meta">项目名称 / 提交时间 / 当前状态</div>
            </article>
          </div>
        </section>
      </div>

      <div class="mobile-bottom-action">
        <button class="mobile-btn">次要操作</button>
        <button class="mobile-btn mobile-btn-primary">主操作</button>
      </div>
    </main>
  </body>
</html>
