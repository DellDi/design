<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PC 静态设计稿模板</title>
    <link rel="stylesheet" href="../dist/pc-design.css">
  </head>
  <body>
    <main class="pc-page">
      <div class="pc-main">
        <header class="pc-page-header">
          <div>
            <h1 class="pc-page-title">页面标题</h1>
            <div class="pc-page-desc">用于 PC 后台、门户、模板管理和亮色看板的静态 HTML 设计稿。</div>
          </div>
          <div class="pc-actions">
            <button class="pc-btn">次要操作</button>
            <button class="pc-btn pc-btn-primary">主操作</button>
          </div>
        </header>

        <section class="pc-card">
          <div class="pc-card-header">
            <h2 class="pc-card-title">模块标题</h2>
          </div>
          <div class="pc-card-body">
            <div class="pc-filter-bar">筛选区</div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
